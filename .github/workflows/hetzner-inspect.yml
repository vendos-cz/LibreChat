name: Inspect Hetzner server

# Read-only reconnaissance: what is running, what holds the web ports, and
# whether a reverse proxy is present that LibreChat could sit behind.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      # This job prints hostnames, container names and network layout. On a
      # public repository, Actions logs are world-readable, so that is an
      # infrastructure disclosure — refuse rather than leak it.
      - name: Require a private repository
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::This repository is public, so its Actions logs are world-readable. This workflow reports server internals and will not run here. Make the repository private, or gather the details out of band."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: ./.github/actions/hetzner-ssh
        with:
          ssh_key: ${{ secrets.HETZNER_SSH_KEY }}
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_SSH_PORT || '22' }}
          user: ${{ secrets.HETZNER_USER || 'root' }}

      - name: Inspect
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER_NAME: ${{ secrets.HETZNER_USER }}
          PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes \
            "${USER_NAME:-root}@$HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "=== host ==="
          hostnamectl 2>/dev/null | sed -n '1,3p'; echo; free -h | head -2; df -h / | tail -1
          echo; echo "=== containers ==="
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' 2>&1
          echo; echo "=== compose projects ==="
          docker ps --format '{{.Label "com.docker.compose.project"}}\t{{.Label "com.docker.compose.project.working_dir"}}' 2>/dev/null | sort -u
          echo; echo "=== listeners on 80/443 ==="
          ss -ltnp "( sport = :80 or sport = :443 )" 2>/dev/null
          echo; echo "=== reverse proxy? ==="
          docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null \
            | grep -iE 'caddy|traefik|nginx|haproxy|swag|npm|proxy' || echo "none matched by image name"
          echo; echo "=== docker networks ==="
          docker network ls --format '{{.Name}}\t{{.Driver}}' 2>/dev/null
          REMOTE

      # The Outlook MCP server authenticates per user through an OBO token
      # exchange, so when it fails the only evidence is in the API log - and
      # the operator does not always have shell access. This step surfaces
      # exactly the lines that matter, with anything JWT-shaped redacted:
      # OBO errors can quote an upstream response, and Actions logs are
      # readable by anyone with repo access.
      - name: Inspect MCP / Outlook
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER_NAME: ${{ secrets.HETZNER_USER }}
          PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes \
            "${USER_NAME:-root}@$HOST" 'bash -s' <<'REMOTE'
          set -u
          redact() { sed -E 's/ey[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}[A-Za-z0-9._-]*/<redacted-jwt>/g'; }
          echo "=== auth-relevant .env flags (values, not secrets) ==="
          grep -E '^(OPENID_REUSE_TOKENS|GRAPH_API_SCOPES)=' \
            /opt/librechat/deploy/hetzner/.env 2>/dev/null || echo "neither key is set"
          echo "OPENID_CLIENT_ID set: $(grep -qE '^OPENID_CLIENT_ID=.+' /opt/librechat/deploy/hetzner/.env && echo yes || echo no)"
          echo; echo "=== ms365-mcp container ==="
          docker ps -a --filter name=chat-ms365-mcp --format '{{.Names}}\t{{.Status}}' 2>&1
          echo; echo "=== can the api container reach it? (200 = yes) ==="
          docker exec LibreChat-API curl -s -o /dev/null -w '%{http_code}\n' --max-time 10 \
            -X POST http://ms365-mcp:3000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' 2>&1
          echo; echo "=== ms365-mcp log (last 30) ==="
          docker logs --tail 30 chat-ms365-mcp 2>&1 | redact
          echo; echo "=== API log, MCP/OBO lines (last 60) ==="
          docker logs --since 6h LibreChat-API 2>&1 \
            | grep -iE 'mcp|obo|outlook|graph|openid' | tail -60 | redact
          REMOTE
