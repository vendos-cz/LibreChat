name: Deploy to Hetzner

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch the server should check out and build'
        required: false
        default: ''
      proxy_network:
        description: 'Existing docker network of a reverse proxy to run behind (empty = LibreChat owns ports 80/443)'
        required: false
        default: ''
      domain:
        description: 'Hostname LibreChat is served on (overrides the HETZNER_DOMAIN secret)'
        required: false
        default: ''
      allow_registration:
        description: 'Open or close self-registration (leave unset to keep the current setting)'
        required: false
        default: ''
        type: choice
        options: ['', 'true', 'false']

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/hetzner-ssh
        with:
          ssh_key: ${{ secrets.HETZNER_SSH_KEY }}
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_SSH_PORT || '22' }}
          user: ${{ secrets.HETZNER_USER || 'root' }}

      # bootstrap.sh is idempotent: it installs missing prerequisites, updates
      # the server's checkout to $BRANCH, preserves the existing .env, then
      # rebuilds and restarts the stack.
      - name: Run bootstrap on the server
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER_NAME: ${{ secrets.HETZNER_USER }}
          PORT: ${{ secrets.HETZNER_SSH_PORT }}
          DOMAIN: ${{ inputs.domain || secrets.HETZNER_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROXY_NETWORK: ${{ inputs.proxy_network || vars.HETZNER_PROXY_NETWORK }}
          ALLOW_REGISTRATION: ${{ inputs.allow_registration }}
          # Optional: set these secrets to manage provider keys and Google
          # OAuth credentials from here instead of editing .env on the server.
          # Unset ones are left alone.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Setting this both delivers the key and makes the Kimi endpoint
          # appear; clearing it removes the endpoint again.
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          # Shared OpenRouter credit for everyone. The endpoint that reads it
          # is the one upstream's example already ships.
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          # Gemini. .env.example ships GOOGLE_KEY=user_provided, so the Google
          # endpoint is already offered and asks every user for their own key.
          # Setting this secret replaces that with one shared key for everyone.
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
          # Web search. Serper is the provider and is required; Firecrawl is the
          # scraper and is optional — without its key bootstrap.sh drops the
          # firecrawl lines so scraping falls to Serper instead of prompting
          # every user for a key.
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Off-site backup destination and the passphrase the archive is
          # encrypted with before it leaves the server. Unset keeps backups
          # local, which does not survive losing the server.
          BACKUP_SSH_TARGET: ${{ vars.BACKUP_SSH_TARGET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          # Additionally offer an OpenRouter entry each user keys themselves.
          # A custom endpoint cannot do both on one entry, so this is a second.
          OPENROUTER_USER_KEYS: ${{ vars.OPENROUTER_USER_KEYS || 'true' }}
          # A Google client id is not confidential — it travels in the redirect
          # every signing-in browser sees — so it is defaulted here rather than
          # stored as a secret, where a truncated paste is invisible and
          # surfaces only as Google's "OAuth client was not found". Override
          # with a repository variable when the client changes.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '851039774056-ai8alf50sv2r5p0hkuna314s8f194u28.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Credentials alone do not surface the Google button — .env.example
          # ships both flags off. Set them as repository variables to enable it.
          ALLOW_SOCIAL_LOGIN: ${{ vars.ALLOW_SOCIAL_LOGIN }}
          ALLOW_SOCIAL_REGISTRATION: ${{ vars.ALLOW_SOCIAL_REGISTRATION }}
          # Social login carries no domain restriction of its own, so this is
          # the only thing standing between a published consent screen and
          # anyone with a Google account registering. Defaulted rather than
          # left to a variable so forgetting the variable fails closed.
          ALLOWED_REGISTRATION_DOMAINS: ${{ vars.ALLOWED_REGISTRATION_DOMAINS || 'nasdum.cz' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" \
            -o BatchMode=yes -o ServerAliveInterval=30 \
            "${USER_NAME:-root}@$HOST" \
            "DOMAIN='$DOMAIN' ACME_EMAIL='$ACME_EMAIL' BRANCH='$DEPLOY_BRANCH' \
             REPO_URL='$REPO_URL' PROXY_NETWORK='$PROXY_NETWORK' \
             ALLOW_REGISTRATION='$ALLOW_REGISTRATION' \
             ANTHROPIC_API_KEY='$ANTHROPIC_API_KEY' \
             OPENAI_API_KEY='$OPENAI_API_KEY' \
             KIMI_API_KEY='$KIMI_API_KEY' \
             OPENROUTER_KEY='$OPENROUTER_KEY' \
             GOOGLE_KEY='$GOOGLE_KEY' \
             SERPER_API_KEY='$SERPER_API_KEY' \
             FIRECRAWL_API_KEY='$FIRECRAWL_API_KEY' \
             BACKUP_SSH_TARGET='$BACKUP_SSH_TARGET' \
             BACKUP_PASSPHRASE='$BACKUP_PASSPHRASE' \
             OPENROUTER_USER_KEYS='$OPENROUTER_USER_KEYS' \
             GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' \
             GOOGLE_CLIENT_SECRET='$GOOGLE_CLIENT_SECRET' \
             ALLOW_SOCIAL_LOGIN='$ALLOW_SOCIAL_LOGIN' \
             ALLOW_SOCIAL_REGISTRATION='$ALLOW_SOCIAL_REGISTRATION' \
             ALLOWED_REGISTRATION_DOMAINS='$ALLOWED_REGISTRATION_DOMAINS' \
             bash -s" < deploy/hetzner/bootstrap.sh
