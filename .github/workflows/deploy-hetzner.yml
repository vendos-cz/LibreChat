name: Deploy to Hetzner

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch the server should check out and build'
        required: false
        default: ''
      proxy_network:
        description: 'Existing docker network of a reverse proxy to run behind (empty = LibreChat owns ports 80/443)'
        required: false
        default: ''
      domain:
        description: 'Hostname LibreChat is served on (overrides the HETZNER_DOMAIN secret)'
        required: false
        default: ''

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/hetzner-ssh
        with:
          ssh_key: ${{ secrets.HETZNER_SSH_KEY }}
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_SSH_PORT || '22' }}
          user: ${{ secrets.HETZNER_USER || 'root' }}

      # bootstrap.sh is idempotent: it installs missing prerequisites, updates
      # the server's checkout to $BRANCH, preserves the existing .env, then
      # rebuilds and restarts the stack.
      - name: Run bootstrap on the server
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER_NAME: ${{ secrets.HETZNER_USER }}
          PORT: ${{ secrets.HETZNER_SSH_PORT }}
          DOMAIN: ${{ inputs.domain || secrets.HETZNER_DOMAIN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          DEPLOY_BRANCH: ${{ inputs.branch || github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          PROXY_NETWORK: ${{ inputs.proxy_network || vars.HETZNER_PROXY_NETWORK }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" \
            -o BatchMode=yes -o ServerAliveInterval=30 \
            "${USER_NAME:-root}@$HOST" \
            "DOMAIN='$DOMAIN' ACME_EMAIL='$ACME_EMAIL' BRANCH='$DEPLOY_BRANCH' \
             REPO_URL='$REPO_URL' PROXY_NETWORK='$PROXY_NETWORK' \
             bash -s" < deploy/hetzner/bootstrap.sh
